<!-- templates/agency/includes/contact_form.html -->

{% load static i18n %}

<!-- ============================================================
     ФОРМА ОБРАТНОЙ СВЯЗИ
     ============================================================ -->

<div class="contact-form-wrapper">
    <form class="contact-form" id="contactForm" method="post" action="{% url 'agency:ajax_contact' %}">
        {% csrf_token %}

        <!-- Поле: Имя -->
        <div class="form-group">
            <label for="userName" class="form-label">{% trans "Ваше имя" %} <span class="required">*</span></label>
            <input type="text" name="name" id="userName" class="form-control" placeholder="{% trans 'Введите ваше имя' %}" required>
            <div class="form-error" id="nameError"></div>
        </div>

        <!-- Поле: Email -->
        <div class="form-group">
            <label for="userEmail" class="form-label">Email <span class="required">*</span></label>
            <input type="email" name="email" id="userEmail" class="form-control" placeholder="example@mail.com" required>
            <div class="form-hint">{% trans "На случай, если выбранный способ связи будет недоступен" %}</div>
            <div class="form-error" id="emailError"></div>
        </div>

        <!-- Поле: Способ связи -->
        <div class="form-group">
            <label for="contactMethod" class="form-label">{% trans "Выберите основной способ связи" %} <span class="required">*</span></label>
            <select name="contact_method" id="contactMethod" class="form-control" required>
                <option value="">{% trans "Выберите способ связи" %}</option>
                <option value="phone">📱 {% trans "Телефон" %}</option>
                <option value="telegram">✈️ Telegram</option>
                <option value="whatsapp">💚 WhatsApp</option>
                <option value="viber">💜 Viber</option>
                <option value="email">📧 Email</option>
            </select>
            <div class="form-error" id="methodError"></div>
        </div>

        <!-- Поле: Контактные данные (появляется динамически) -->
        <div class="form-group dynamic-field" id="contactValueGroup" style="display: none;">
            <label for="contactValue" class="form-label" id="contactValueLabel">{% trans "Контактные данные" %} <span class="required">*</span></label>
            <input type="text" name="contact_value" id="contactValue" class="form-control" placeholder="{% trans 'Введите контактные данные' %}">
            <div class="form-hint" id="contactValueHint"></div>
            <div class="form-error" id="contactValueError"></div>
        </div>

        <!-- Поле: Тариф -->
        <div class="form-group">
            <label for="tariffSelect" class="form-label">{% trans "Интересующий тариф" %}</label>
            <select name="tariff" id="tariffSelect" class="form-control">
                <option value="">{% trans "Выберите тариф" %}</option>
                {% for tariff in tariffs %}
                <option value="{{ tariff.id }}">{{ tariff.name }} — {{ tariff.site_format|default:_("Индивидуальный") }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Поле: Описание проекта -->
        <div class="form-group">
            <label for="projectDescription" class="form-label">{% trans "Опишите ваш проект" %} <span class="required">*</span></label>
            <textarea name="message" id="projectDescription" class="form-control" rows="5" placeholder="{% trans 'Расскажите о вашем проекте...' %}" required></textarea>
            <div class="form-error" id="messageError"></div>
        </div>

        <!-- Cloudflare Turnstile -->
        <div class="form-group turnstile-wrapper">
            <div class="cf-turnstile" data-sitekey="{{ cf_turnstile_site_key }}" data-theme="{{ current_theme|default:'light' }}"
                 data-language="{% if current_language == 'en' %}en{% else %}ru{% endif %}"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            {% trans "Отправить заявку" %}
            <span class="arrow">→</span>
        </button>

        <p class="form-note">{% trans "Мы свяжемся с вами в ближайшее время" %}</p>
    </form>
</div>

<style>
/* ============================================================
   СТИЛИ ДЛЯ ФОРМЫ
   ============================================================ */

.contact-form-wrapper {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
}

.contact-form .form-group {
    margin-bottom: 20px;
}

.contact-form .form-label {
    display: block;
    font-family: var(--font-sans, 'Manrope', sans-serif);
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-primary, #F5F3EF);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
}

[data-theme="light"] .contact-form .form-label {
    color: #111111;
}

.contact-form .form-label .required {
    color: #E74C3C;
}

.contact-form .form-control {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    color: var(--color-text-primary, #F5F3EF);
    font-family: var(--font-sans, 'Manrope', sans-serif);
    font-size: 14px;
    transition: all 0.3s ease;
    outline: none;
}

[data-theme="light"] .contact-form .form-control {
    background: rgba(0, 0, 0, 0.03);
    border-color: rgba(0, 0, 0, 0.1);
    color: #111111;
}

.contact-form .form-control:focus {
    border-color: var(--color-gold, #C89A5B);
    box-shadow: 0 0 0 3px rgba(200, 154, 91, 0.15);
    background: rgba(255, 255, 255, 0.08);
}

[data-theme="light"] .contact-form .form-control:focus {
    background: rgba(255, 255, 255, 0.8);
}

.contact-form .form-control::placeholder {
    color: var(--color-text-secondary, #A6A3A0);
    opacity: 0.6;
}

[data-theme="light"] .contact-form .form-control::placeholder {
    color: #999999;
}

.contact-form .form-control textarea {
    resize: vertical;
    min-height: 120px;
}

.contact-form .form-hint {
    font-size: 12px;
    color: var(--color-text-secondary, #A6A3A0);
    opacity: 0.7;
    margin-top: 4px;
}

.contact-form .form-error {
    font-size: 12px;
    color: #E74C3C;
    margin-top: 4px;
    display: none;
}

.contact-form .turnstile-wrapper {
    margin: 20px 0;
    display: flex;
    justify-content: center;
}

.contact-form .btn-block {
    width: 100%;
    padding: 14px 24px;
    font-size: 15px;
    justify-content: center;
}

.contact-form .form-note {
    text-align: center;
    font-size: 13px;
    color: var(--color-text-secondary, #A6A3A0);
    opacity: 0.7;
    margin-top: 16px;
}

/* ============================================================
   АДАПТИВНОСТЬ
   ============================================================ */

@media (max-width: 768px) {
    .contact-form-wrapper {
        max-width: 100%;
    }
    .contact-form .form-control {
        padding: 10px 14px;
        font-size: 13px;
    }
    .contact-form .btn-block {
        padding: 12px 20px;
        font-size: 14px;
    }
}

@media (max-width: 480px) {
    .contact-form .form-control {
        padding: 8px 12px;
        font-size: 12px;
    }
    .contact-form .form-label {
        font-size: 12px;
    }
    .contact-form .btn-block {
        padding: 10px 16px;
        font-size: 13px;
    }
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
    .contact-form .form-control {
        transition: none !important;
    }
    .contact-form #contactValueGroup {
        transition: none !important;
    }
}
</style>
